name: Aristotle POS CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Izin untuk GitHub Pages deployment & GitHub Release creation
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Deploy Web App ke GitHub Pages (OTA Cloud Updates)
  # ==========================================
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Firebase Config from Secrets
        run: |
          cat > js/firebase-config.js <<'EOF'
          // Dibuat otomatis oleh CI dari GitHub Secrets — jangan commit manual.
          export const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Unggah direktori root (index.html, css, js, sw.js, manifest.json)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================
  # JOB 2: Build Native Android APK (Aristotle-POS.apk)
  # ==========================================
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject Firebase Config from Secrets
        run: |
          cat > js/firebase-config.js <<'EOF'
          // Dibuat otomatis oleh CI dari GitHub Secrets — jangan commit manual.
          export const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
            measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
          };
          EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Verify Consistent Debug Keystore for CI Build
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          else
            echo "Using consistent repository debug.keystore (signing key preserved)."
          fi

      - name: Setup Release Keystore from Secrets
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 belum diisi. Tambahkan di repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "Release keystore restored."

      - name: Extract Release Version Metadata
        id: version_meta
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName || '1.1.3'")
          VERSION_CODE=$(node -p "require('./version.json').versionCode || ${{ github.run_number }}")
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=Aristotle POS ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Generate Dynamic Release Notes
        run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('./version.json')) {
              const v = require('./version.json');
              let notes = '# Aristotle POS v' + v.versionName + '\n\n';
              if (v.releaseDate) notes += '**Tanggal Rilis:** ' + v.releaseDate + '\n\n';
              notes += '### Catatan Pembaruan:\n';
              if (Array.isArray(v.changelog)) {
                v.changelog.forEach(c => { notes += '- ' + c + '\n'; });
              }
              notes += '\n---\n*Pembaruan ini tersedia otomatis dari dalam aplikasi (In-App Auto-Updater).*';
              fs.writeFileSync('RELEASE_NOTES.md', notes);
            }
          "

      - name: Sync Latest Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/
          cp -r index.html manifest.json icon.svg sw.js version.json css js fonts android/app/src/main/assets/

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease -PcustomVersionCode=${{ steps.version_meta.outputs.version_code }} -PcustomVersionName=${{ steps.version_meta.outputs.version_name }} -PreleaseStorePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} -PreleaseKeyAlias=${{ secrets.RELEASE_KEY_ALIAS }} -PreleaseKeyPassword=${{ secrets.RELEASE_KEY_PASSWORD }} --no-daemon

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Aristotle-POS.apk
          sha256sum Aristotle-POS.apk | awk '{print $1}' > Aristotle-POS.apk.sha256

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aristotle-POS-APK
          path: Aristotle-POS.apk
          retention-days: 30

      - name: Publish GitHub Release with APK & Changelog
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.version_meta.outputs.tag_name }}
          name: ${{ steps.version_meta.outputs.release_name }}
          body_path: RELEASE_NOTES.md
          files: |
            Aristotle-POS.apk
            Aristotle-POS.apk.sha256
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
