plugins {
    id 'com.android.application'
}

def appVersionCode = project.hasProperty('customVersionCode') ? project.property('customVersionCode').toInteger() : 150
def appVersionName = project.hasProperty('customVersionName') ? project.property('customVersionName') : "1.2.101"

android {
    namespace 'com.aristotle.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.aristotle.pos"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            // Kredensial dari CI (-P...=...) atau env. TIDAK PERNAH hardcode.
            // Build rilis lokal butuh file android/app/release.keystore + props ini.
            storeFile file("release.keystore")
            storePassword project.findProperty('releaseStorePassword') ?: System.getenv('RELEASE_STORE_PASSWORD')
            keyAlias project.findProperty('releaseKeyAlias') ?: System.getenv('RELEASE_KEY_ALIAS') ?: 'aristotle-release'
            keyPassword project.findProperty('releaseKeyPassword') ?: System.getenv('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            // R8/ProGuard DIMATIKAN sengaja: bridge @JavascriptInterface WebView
            // dipanggil via refleksi dan rawan ter-strip rename oleh minify.
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.release
            manifestPlaceholders = [allowBackupFlag: "false"]
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
            manifestPlaceholders = [allowBackupFlag: "true"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
